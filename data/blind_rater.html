<!doctype html>
<html><head><meta charset="utf-8"><title>Blind Rating</title>
<style>
:root{--bg:#111;--fg:#eee;--dim:#888;--line:#333;--acc:#4fa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
#bar{flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden}
#fill{height:100%;background:var(--acc);width:0}
#count{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px;position:relative}
#img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;cursor:zoom-in;
     display:block;margin:auto}
#img.zoomed{max-width:none;max-height:none;cursor:grab}
#img.dragging{cursor:grabbing}
#zlvl{position:absolute;top:14px;right:14px;background:#000a;border:1px solid var(--line);
      border-radius:5px;padding:4px 10px;font-size:13px;color:var(--fg);pointer-events:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
footer{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:5px}
.grp .row{display:flex;gap:8px;align-items:center}
.lbl{font-size:10.5px;letter-spacing:.09em;color:var(--dim)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
button[data-call]{border-color:#3a3a3a}
button[data-call]:hover{background:#243b55;border-color:var(--acc)}
button{background:#1c1c1c;color:var(--fg);border:1px solid var(--line);border-radius:6px;
       padding:9px 14px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button b{color:var(--acc)}
.tag{background:#1c1c1c;border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;user-select:none}
.tag.on{background:var(--acc);border-color:#fff;color:#000;font-weight:700}
.tag.on::before{content:"\2713 "}
#flags{position:absolute;top:14px;left:14px;display:flex;gap:8px;pointer-events:none}
#flags span{background:var(--acc);color:#000;font-weight:700;border-radius:5px;padding:4px 10px;font-size:13px}
#note{background:#1a1a1a;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:9px;
      font:inherit;flex:1;min-width:140px}
#note:focus{outline:none;border-color:#e6a100;background:#1f1a10}
#hint{color:var(--dim)}
body.noting #hint{color:#e6a100;font-weight:600}
body.noting footer{box-shadow:inset 0 0 0 2px #e6a100}
#spacer{flex:1}
#done{display:none;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:40px}
#done.show{display:flex}
kbd{background:#222;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--dim)}
small{color:var(--dim)}
</style></head><body>
<header>
  <strong>Blind rating</strong>
  <div id="bar"><div id="fill"></div></div>
  <div id="count">0 / 0</div>
  <button id="export">Export CSV</button>
  <button id="reset" title="Delete all stored calls and start from the first image">Reset all</button>
</header>
<main>
  <div id="wrap"><img id="img" alt=""></div>
  <div id="flags"></div>
  <div id="zlvl">fit</div>
  <div id="done">
    <h2>All images rated.</h2>
    <p>Export the CSV, then the condition key may be opened for the first time.</p>
    <button id="export2">Export CSV</button>
  </div>
</main>
<footer>
  <div class="grp">
    <span class="lbl">CALL &mdash; picks one and moves on</span>
    <div class="row">
      <button data-call="fragmented"><b>F</b>ragmented</button>
      <button data-call="normal"><b>N</b>ormal / mixed</button>
      <button data-call="elongated"><b>E</b>longated</button>
      <button data-call="uncertain"><b>U</b>ncertain</button>
    </div>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <span class="lbl">TAGS &mdash; optional, does not advance</span>
    <div class="row">
      <div class="tag" id="tD"><b>D</b>onut</div>
      <div class="tag" id="tC"><b>C</b>lump</div>
      <input id="note" placeholder="note (optional)">
      <button id="back">&larr; Undo</button>
    </div>
  </div>
  <span id="spacer"></span>
  <small id="hint"><kbd>F</kbd><kbd>N</kbd><kbd>E</kbd><kbd>U</kbd> call &middot; <kbd>D</kbd><kbd>C</kbd> flags &middot; <kbd>Z</kbd>/<kbd>+</kbd>/<kbd>-</kbd> zoom 1-4x &middot; drag to pan &middot; <kbd>Backspace</kbd> undo &middot; <kbd>Esc</kbd> leave note</small>
</footer>
<script>

const KEY = 'blind_rating_v2';          // v2 = four-option scheme
try { localStorage.removeItem('blind_rating_v1'); } catch(e) {}   // discard pre-scheme calls
let calls = JSON.parse(localStorage.getItem(KEY) || '{}');
let idx = 0, donut = false, clump = false;
const img=document.getElementById('img'), fill=document.getElementById('fill'),
      count=document.getElementById('count'), note=document.getElementById('note'),
      tD=document.getElementById('tD'), tC=document.getElementById('tC'),
      done=document.getElementById('done'), wrap=document.getElementById('wrap');

function firstUnrated(){ let i=0; while(i<ORDER.length && calls[ORDER[i]]) i++; return i; }
function show(){
  const n=Object.keys(calls).length;
  count.textContent = 'image ' + Math.min(idx+1, ORDER.length) + ' of ' + ORDER.length + '  \u00b7  ' + n + ' rated';
  fill.style.width = (100*n/ORDER.length) + '%';
  if(idx>=ORDER.length){ wrap.style.display='none'; done.classList.add('show'); return; }
  wrap.style.display='flex'; done.classList.remove('show');
  setZoom(0);
  img.src = 'rating_png/' + ORDER[idx] + '.png';
  donut=false; clump=false; paintFlags(); note.value='';
  note.blur();
}
function record(call){
  try{
  if(idx>=ORDER.length) return;
  const tags=[]; if(donut) tags.push('donut'); if(clump) tags.push('clump');
  const txt=note.value.trim().replace(/,/g,';');
  if(txt) tags.push(txt);
  calls[ORDER[idx]] = {call:call, notes:tags.join('; '), date:new Date().toISOString().slice(0,10)};
  localStorage.setItem(KEY, JSON.stringify(calls));
  idx++; show();
  }catch(err){ alert('record() failed: '+err.message); throw err; }
}
document.querySelectorAll('button[data-call]').forEach(b=>{
  b.addEventListener('mousedown',e=>{ e.preventDefault(); record(b.dataset.call); });
});
const flagBox=document.getElementById('flags');
function paintFlags(){
  tD.classList.toggle('on',donut); tC.classList.toggle('on',clump);
  flagBox.innerHTML = (donut?'<span>DONUT</span>':'') + (clump?'<span>CLUMP</span>':'');
}
tD.onclick=()=>{donut=!donut;paintFlags()};
tC.onclick=()=>{clump=!clump;paintFlags()};
// ---- zoom: fit -> 1x -> 2x -> 4x, wheel to zoom, drag to pan ----
const LEVELS=[0,1,2,4], zl=document.getElementById('zlvl');
let zi=0;
function applyZoom(cx,cy){
  const f=LEVELS[zi];
  if(f===0){
    img.classList.remove('zoomed'); img.style.width=''; img.style.height='';
    zl.textContent='fit';
  }else{
    img.classList.add('zoomed');
    img.style.width=(img.naturalWidth*f)+'px'; img.style.height='auto';
    zl.textContent=f+'x';
    // keep the clicked point roughly centred
    requestAnimationFrame(()=>{
      const rx = cx==null ? 0.5 : cx, ry = cy==null ? 0.5 : cy;
      wrap.scrollLeft = rx*wrap.scrollWidth  - wrap.clientWidth/2;
      wrap.scrollTop  = ry*wrap.scrollHeight - wrap.clientHeight/2;
    });
  }
}
function setZoom(i,cx,cy){ zi=Math.max(0,Math.min(LEVELS.length-1,i)); applyZoom(cx,cy); }
img.addEventListener('click',e=>{
  const r=img.getBoundingClientRect();
  setZoom(zi+1<LEVELS.length?zi+1:0,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=img.getBoundingClientRect();
  setZoom(zi+(e.deltaY<0?1:-1),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
},{passive:false});
let drag=null;
img.addEventListener('mousedown',e=>{
  if(!img.classList.contains('zoomed')) return;
  drag={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop};
  img.classList.add('dragging'); e.preventDefault();
});
addEventListener('mousemove',e=>{
  if(!drag) return;
  wrap.scrollLeft=drag.l-(e.clientX-drag.x);
  wrap.scrollTop =drag.t-(e.clientY-drag.y);
});
addEventListener('mouseup',()=>{ if(drag){drag=null; img.classList.remove('dragging');} });
document.getElementById('back').onclick=()=>{
  if(idx>0){ idx--; delete calls[ORDER[idx]]; localStorage.setItem(KEY,JSON.stringify(calls)); show(); }
};
addEventListener('keydown',e=>{
  if(e.target===note){ if(e.key==='Enter'||e.key==='Escape') note.blur(); return; }
  const k=e.key.toLowerCase();
  if(k==='f') record('fragmented');
  else if(k==='n') record('normal');
  else if(k==='e') record('elongated');
  else if(k==='u') record('uncertain');
  else if(k==='d'){ donut=!donut; paintFlags(); }
  else if(k==='c'){ clump=!clump; paintFlags(); }
  else if(k==='z') setZoom(zi+1<LEVELS.length?zi+1:0);
  else if(k==='+'||k==='='){ setZoom(zi+1); }
  else if(k==='-'||k==='_'){ setZoom(zi-1); }
  else if(k==='0') setZoom(0);
  else if(k==='Backspace'||e.key==='Backspace'){ e.preventDefault(); document.getElementById('back').click(); }
});
function exportCsv(){
  let out='image_id,blinded_call,date_rated,notes\n';
  for(const id of ORDER){
    const c=calls[id];
    out += id + ',' + (c?c.call:'') + ',' + (c?c.date:'') + ',' + (c?c.notes:'') + '\n';
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));
  a.download='labels_blind.csv'; a.click();
}
const hint=document.getElementById('hint');
const HINT_IDLE=hint.innerHTML;
note.addEventListener('focus',()=>{
  document.body.classList.add('noting');
  hint.innerHTML='typing a note - shortcuts paused. Press <kbd>Enter</kbd> or <kbd>Esc</kbd>, or just click a call button.';
});
note.addEventListener('blur',()=>{
  document.body.classList.remove('noting');
  hint.innerHTML=HINT_IDLE;
});
wrap.addEventListener('mousedown',()=>note.blur());
document.getElementById('reset').onclick=()=>{
  const n=Object.keys(calls).length;
  if(!confirm('Delete all '+n+' stored calls and start over?\n\nThis cannot be undone. Export first if you want a copy.')) return;
  calls={}; localStorage.removeItem(KEY); idx=0; show();
};
document.getElementById('export').onclick=exportCsv;
document.getElementById('export2').onclick=exportCsv;
idx=firstUnrated(); show();
</script></body></html>
